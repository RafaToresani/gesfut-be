spring.application.name=gesfut
# Secretos: variables de entorno o archivo local ignorado (ver application-local.properties.example)
spring.config.import=optional:file:./application-local.properties
server.port=8080

#BBDD CONNECTION
spring.datasource.url=${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Rendimiento: carga colecciones lazy en lotes (evita N+1 en torneo/fechas/partidos/eventos)
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# open-in-view se mantiene activo (default): no se pudo verificar todos los endpoints admin sin LazyInitializationException

#CORS
cors.allowed.origins=${FE_URL}

#JWT
SECRET.KEY=${SECRET_KEY}


#GMAIL SERVICE SMTP CONFIGURATION
spring.mail.host=smtp.gmail.com
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true