spring.application.name=gesfut
# Secretos: variables de entorno o archivo local ignorado (ver application-local.properties.example)
spring.config.import=optional:file:./application-local.properties
server.port=8080

#BBDD CONNECTION
spring.datasource.url=${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# A4 #7: el esquema lo maneja Flyway (src/main/resources/db/migration); Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
# Flyway APAGADO por defecto: ningun arranque normal migra (tampoco restart-nobuild.ps1).
# Con Flyway apagado y ddl-auto=validate, el back solo arranca si la base YA tiene el esquema de la ultima V (hoy V2).
# GESFUT2: primero probar con cu\work\plan\probar-flyway-en-copia-gesfut2.ps1 sobre una copia; despues, con backup
# y OK de Mateo, un unico arranque con FLYWAY_ENABLED=true para migrarla. Nunca "clean".
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration
# Bases que ya tienen el esquema (GESFUT2, regresion): se marcan en V1 sin ejecutarla y siguen con V2+.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Rendimiento: carga colecciones lazy en lotes (evita N+1 en torneo/fechas/partidos/eventos)
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# Sesión de Hibernate solo dentro de @Transactional (verificado con GETs admin/públicos y e2e de escritura)
spring.jpa.open-in-view=false

#CORS
cors.allowed.origins=${FE_URL}

#JWT
SECRET.KEY=${SECRET_KEY}


#GMAIL SERVICE SMTP CONFIGURATION
spring.mail.host=smtp.gmail.com
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# A4 #7: Swagger/OpenAPI apagado por defecto (produccion). En desarrollo se enciende con app.security.swagger-public=true.
springdoc.api-docs.enabled=${app.security.swagger-public:false}
springdoc.swagger-ui.enabled=${app.security.swagger-public:false}
